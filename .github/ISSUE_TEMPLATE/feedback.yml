name: Feedback or feature request
description: Share what is useful, confusing, or missing.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Agent Monitor! Rough notes are welcome; you do not need a proposed solution.
        Reports are public. Remove private prompts, code, credentials, and personal
        information from screenshots or examples. Do not upload raw session logs or transcripts.
  - type: textarea
    id: feedback
    attributes:
      label: What would you like to share?
      description: Tell us what worked well, felt confusing, or could be improved.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What were you trying to do?
      description: Optional context about your workflow helps us understand your feedback.
  - type: textarea
    id: suggestion
    attributes:
      label: Any ideas or examples?
      description: Optional suggestions, alternatives, or sanitized screenshots.
